<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #0d1f1a; }
  #art { position: absolute; right: 0; top: 0; width: 360px; height: 360px; }
  #art svg { width: 360px; height: 360px; display: block; }
  #art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0d1f1a, transparent 35%); }
  .text { position: absolute; left: 36px; top: 0; bottom: 0; width: 300px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  h1 { margin: 0; font: 400 44px/1.1 'Poiret One', serif; letter-spacing: 0.06em; color: #e6cf8f; text-transform: uppercase; }
  p { margin: 0; font: 13px/1 serif; letter-spacing: 0.4em; color: #c9a24a; text-transform: uppercase; }
  .frame { position: absolute; inset: 10px; border: 1.5px solid #c9a24a; }
  .frame::after { content: ''; position: absolute; inset: 5px; border: 0.7px solid rgba(201,162,74,.5); }
</style></head>
<body>
  <div id="art"></div>
  <div class="text"><p>Детектив · 1926</p><h1>Смерть<br>в Блэквуд-<br>холле</h1></div>
  <div class="frame"></div>
  <script type="module">
    import { coverSvg } from '../../js/art/cover.js';
    document.getElementById('art').innerHTML = coverSvg().replace('viewBox="0 0 400 780" preserveAspectRatio="xMidYMin slice"', 'viewBox="20 60 380 380" preserveAspectRatio="xMidYMid slice"');
  </script>
</body></html>
